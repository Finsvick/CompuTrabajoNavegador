#   salary: "$ 900.000 mensuales"        # pretensión de jornada completa
#   salary_part_time: "$ 500.000"        # pretensión de media jornada (medio tiempo, part time o franja de 6 horas o menos)
#   salary_daily: "$ 40.000 por día"     # pretensión por día o por jornada
